  <body class="bg-dark-950 text-dark-100">
    <div id="root">
      <noscript>
        <div
          style="
            padding: 2rem;
            text-align: center;
            background: #030712;
            color: #fff;
            min-height: 100vh;
          "
        >
          <h1>Diseño Web para Autónomos y Pymes en Madrid, Rivas y toda España | ZeroCode</h1>
          <p>
            Tu negocio ya existe, ahora necesita su web. En ZeroCode (David González) diseñamos páginas web a medida para autónomos y pymes en Madrid, Rivas-Vaciamadrid y toda España. Te preparamos una propuesta visual personalizada en 48 horas sin compromiso para que veas el resultado antes de decidir, adaptándonos a tu presupuesto.
          </p>
          <ul>
            <li>Una página con Inicio y Contacto</li>
            <li>Diseño adaptado a móviles</li>
            <li>Dominio, hosting durante un año y certificado SSL</li>
          </ul>
          <p>Contacta por WhatsApp o en admin@zerocode-devops.com</p>
        </div>
      </noscript>
      <style>
        .initial-loader {
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          width: 100vw;
          background-color: #030712;
          flex-direction: column;
          gap: 1.5rem;
        }
        .loader-brackets {
          display: flex;
          gap: 1rem;
          font-family: monospace;
          font-weight: 900;
          font-size: 4rem;
          animation: pulse 2s infinite ease-in-out;
        }
        .bracket-left {
          color: #06b6d4;
          text-shadow: 0 0 20px rgba(6, 182, 212, 0.5);
          animation: slideRight 1.5s infinite alternate ease-in-out;
        }
        .bracket-right {
          color: #8b5cf6;
          text-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
          animation: slideLeft 1.5s infinite alternate ease-in-out;
        }
        @keyframes pulse {
          0%,
          100% {
            opacity: 1;
            transform: scale(1);
          }
          50% {
            opacity: 0.8;
            transform: scale(0.95);
          }
        }
        @keyframes slideRight {
          from {
            transform: translateX(0);
          }
          to {
            transform: translateX(10px);
          }
        }
        @keyframes slideLeft {
          from {
            transform: translateX(0);
          }
          to {
            transform: translateX(-10px);
          }
        }
      </style>
      <div class="initial-loader">
        <div class="loader-brackets">
          <span class="bracket-left">&lt;</span>
          <span class="bracket-right">&gt;</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
